components:
  headers:
    RequestId:
      description: UUID gerado pelo servidor a cada requisição. Não aceita valor fornecido pelo cliente.
      schema: { type: string, format: uuid }
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserId:
      name: user
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  schemas:
    VehicleFinanceCategoryInput:
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind: { type: string, enum: [expense, income] }
        name: { type: string, minLength: 2, maxLength: 80 }
    VehicleFinanceCategoryUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        is_active: { type: boolean }
    VehicleFinanceEntryInput:
      type: object
      additionalProperties: false
      required: [kind, status, description, amount_cents]
      description: "Exige category ou category_id. category_id deve apontar para categoria ativa da mesma natureza."
      properties:
        kind: { type: string, enum: [expense, income] }
        status: { type: string, enum: [planned, realized] }
        category_id: { type: integer, nullable: true, minimum: 1 }
        category: { type: string, minLength: 2, maxLength: 80 }
        description: { type: string, minLength: 2, maxLength: 255 }
        amount_cents: { type: integer, format: int64, minimum: 1, maximum: 999999999999 }
        effective_on: { type: string, format: date, nullable: true }
    VehicleFinanceReplacementInput:
      allOf:
        - $ref: '#/components/schemas/VehicleFinanceEntryInput'
        - type: object
          required: [reason]
          properties:
            reason: { type: string, minLength: 5, maxLength: 500 }
    VehicleFinanceVoidInput:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 500, nullable: true }
    VehicleFinanceDocumentAttach:
      type: object
      required: [file]
      properties:
