        '409': { description: Revisão ou chave idempotente em conflito }
        '422': { $ref: '#/components/responses/ValidationError' }
  /finance/distribution-batches/{batch}/export:
    get:
      tags: [Modelos e lotes]
      operationId: distributionBatchesExport
      summary: Exportar CSV privado do lote sem instruções financeiras
      description: Requer JWT, cases.manage E scenarios.manage. Propostas não são títulos nem pagamentos.
      security:
        - BearerAuth: []
      parameters:
        - name: batch
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Resposta autenticada de planejamento
          content:
            text/csv:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Recurso inexistente }
        '409': { description: Revisão ou chave idempotente em conflito }
        '422': { $ref: '#/components/responses/ValidationError' }

components:
  headers:
    RequestId:
      description: UUID gerado pelo servidor a cada requisição. Não aceita valor fornecido pelo cliente.
      schema: { type: string, format: uuid }
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserId:
      name: user
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  schemas:

    DistributionLineInput:
      type: object
      additionalProperties: false
      required: [party_id, basis_points]
      properties:
        party_id: { type: integer, minimum: 1 }
        basis_points: { type: integer, minimum: 1, maximum: 10000, description: 10000 representa 100 por cento }
        memo: { type: string, nullable: true, maxLength: 240 }
    DistributionTemplateCreate:
      type: object
      additionalProperties: false
      required: [case_id, name, description, source_party_id, lines]
      properties:
        case_id: { type: integer, minimum: 1 }
        name: { type: string, minLength: 2, maxLength: 180 }
        description: { type: string, nullable: true, maxLength: 4000 }
        source_party_id: { type: integer, minimum: 1 }
        lines:
          type: array
          minItems: 1
          maxItems: 50
          description: Soma dos basis_points precisa ser exatamente 10000.
          items: { $ref: '#/components/schemas/DistributionLineInput' }
    DistributionTemplateReplace:
      type: object
      additionalProperties: false
      required: [revision, name, description, source_party_id, lines]
      properties:
        revision: { type: integer, minimum: 1 }
        name: { type: string, minLength: 2, maxLength: 180 }
        description: { type: string, nullable: true, maxLength: 4000 }
        source_party_id: { type: integer, minimum: 1 }
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/DistributionLineInput' }
    DistributionTemplateState:
      type: object
      additionalProperties: false
      required: [revision, action]
      properties:
        revision: { type: integer, minimum: 1 }
        action: { type: string, enum: [archive, reopen] }
    DistributionTemplateFork:
      type: object
      additionalProperties: false
      required: [revision, name]
      properties:
        revision: { type: integer, minimum: 1 }
        name: { type: string, minLength: 2, maxLength: 180 }
    DistributionTemplatePreview:
      type: object
      additionalProperties: false
      required: [template_revision, gross_amount_cents]
      properties:
        template_revision: { type: integer, minimum: 1 }
        gross_amount_cents: { type: integer, format: int64, minimum: 1, maximum: 1000000000000 }
    DistributionBatchRow:
      type: object
      additionalProperties: false
      required: [client_reference, title, gross_amount_cents]
      properties:
        client_reference: { type: string, format: uuid }
        title: { type: string, minLength: 2, maxLength: 180 }
        gross_amount_cents: { type: integer, format: int64, minimum: 1, maximum: 1000000000000 }
        description: { type: string, nullable: true, maxLength: 4000 }
    DistributionBatchWrite:
      type: object
      additionalProperties: false
      required: [request_key, template_revision, rows]
      properties:
        request_key: { type: string, format: uuid, description: Idempotência persistida; repetição idêntica devolve mesmo lote }
        template_revision: { type: integer, minimum: 1 }
        rows:
          type: array
          minItems: 1
          maxItems: 30
          items: { $ref: '#/components/schemas/DistributionBatchRow' }

    ScenarioAllocationInput:
      type: object
      additionalProperties: false
      required: [party_id, amount_cents]
      properties:
        party_id: { type: integer, minimum: 1 }
        amount_cents: { type: integer, format: int64, minimum: 1, maximum: 1000000000000 }
        memo: { type: string, nullable: true, maxLength: 240 }
    ScenarioDraftBase:
      type: object
      description: Base compartilhada. A API rejeita campos desconhecidos no payload final.
      required: [title, description, source_party_id, gross_amount_cents, allocations]
      properties:
        title: { type: string, minLength: 2, maxLength: 180 }
        description: { type: string, nullable: true, maxLength: 4000 }
        source_party_id: { type: integer, nullable: true, minimum: 1 }
        gross_amount_cents: { type: integer, format: int64, minimum: 1, maximum: 1000000000000 }
        allocations:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ScenarioAllocationInput' }
    ScenarioCreateInput:
      allOf:
        - { $ref: '#/components/schemas/ScenarioDraftBase' }
        - type: object
          required: [case_id, client_reference]
          properties:
            case_id: { type: integer, minimum: 1 }
            client_reference: { type: string, format: uuid }
    ScenarioReplaceInput:
      allOf:
        - { $ref: '#/components/schemas/ScenarioDraftBase' }
        - type: object
          required: [revision]
          properties:
            revision: { type: integer, minimum: 1 }
    ScenarioRecord:
      type: object
      description: Somente cenário hipotético, jamais ordem de pagamento.
      required: [id, case_id, title, currency, gross_amount_cents, allocated_cents, difference_cents, balance_state, revision, executable, payment_enabled]
      properties:
        id: { type: integer }
        case_id: { type: integer }
        title: { type: string }
        currency: { type: string, enum: [BRL] }
        gross_amount_cents: { type: integer, format: int64 }
        allocated_cents: { type: integer, format: int64 }
        difference_cents: { type: integer, format: int64 }
        source_party_id: { type: integer, nullable: true }
        allocations:
          type: array
          items: { type: object }
        balance_state: { type: string, enum: [missing_source, missing_allocations, underallocated, overallocated, balanced] }
        revision: { type: integer }
        archived_at: { type: string, nullable: true }
        executable: { type: boolean, enum: [false] }
        payment_enabled: { type: boolean, enum: [false] }
    ScenarioSummary:
      type: object
      properties:
        total: { type: integer }
        active: { type: integer }
        archived: { type: integer }
        balanced_drafts: { type: integer }
        incomplete_drafts: { type: integer }
        payment_enabled: { type: boolean, enum: [false] }
    PartyRecord:
      type: object
      required: [id, type, name, is_active]
      properties:
        id: { type: integer }
        type: { type: string, enum: [person, company] }
        name: { type: string, maxLength: 180 }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, nullable: true }
        notes: { type: string, nullable: true, description: Somente para operadores autorizados }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    StoreParty:
      type: object
      required: [type, name]
      properties:
        type: { type: string, enum: [person, company] }
        name: { type: string, minLength: 2, maxLength: 180 }
        email: { type: string, format: email, maxLength: 254, nullable: true }
        phone: { type: string, maxLength: 40, nullable: true }
        notes: { type: string, maxLength: 2000, nullable: true }
    UpdateParty:
      type: object
      properties:
        type: { type: string, enum: [person, company] }
        name: { type: string, minLength: 2, maxLength: 180 }
        email: { type: string, format: email, maxLength: 254, nullable: true }
        phone: { type: string, maxLength: 40, nullable: true }
        notes: { type: string, maxLength: 2000, nullable: true }
    Readiness:
      type: object
      required: [status, service, version]
      properties:
        status:
          type: string
          enum: [ready, unavailable]
        service:
          type: string
          enum: [fluxo-repasse-api]
        version:
          type: string
          enum: [v1]
    UserAuditEvent:
      type: object
      required: [id, event_type, actor_user_id, created_at]
      properties:
        id: { type: integer }
        event_type: { type: string }
        actor_user_id: { type: integer, nullable: true }
        created_at:
          type: string
          description: Timestamp registrado pelo banco da API.
    UserAuditPage:
      type: object
      required: [user_id, events]
      properties:
        user_id: { type: integer }
        events:
          type: object
          required: [data, current_page, last_page, total]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/UserAuditEvent' }
            current_page: { type: integer }
            last_page: { type: integer }
            total: { type: integer }
    UserRecord:
      type: object
      required: [id, name, email, is_active, created_at]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
    UserResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/UserRecord' }
    UsersPage:
      type: object
      required: [current_page, data, last_page, per_page, total]
      properties:
        current_page: { type: integer }
        data:
          type: array
          items: { $ref: '#/components/schemas/UserRecord' }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
    StoreUser:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name: { type: string, minLength: 2, maxLength: 255 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 12 }
        password_confirmation: { type: string, format: password, minLength: 12 }
    UpdateUser:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 255 }
        email: { type: string, format: email, maxLength: 254 }
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password, new_password_confirmation]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 12
          description: Requer maiúscula, minúscula, número e símbolo.
        new_password_confirmation:
          type: string
          format: password
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
    Token:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: Token privado, de curta duração.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Tempo de validade em segundos.
          example: 900
    ProfileResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, name, email]
          properties:
            id:
              type: integer
            name:
              type: string
            email:
              type: string
              format: email
            permissions:
              type: array
              items: { type: string }
    Error:
      type: object
      properties:
        message:
          type: string
  responses:
    Forbidden:
      description: Permissão técnica users.manage ausente
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Credenciais inválidas, sessão ausente ou token recusado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Campos inválidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
