openapi: 3.0.3
info:
  title: Fluxo Repasse API
  version: 1.7.0
  description: |
    Contratos da fundação de identidade e conectividade.
    Inclui controle de ciclo de vida de conta, rotação global de sessões e auditoria de identidade.
    Respostas v1 aplicam Cache-Control no-store/private, Pragma no-cache, nosniff,
    Referrer-Policy no-referrer, X-Frame-Options DENY e CSP restritiva.
    Toda resposta da API expõe X-Request-ID gerado pelo servidor, para correlação de erros sem dados privados.
    Cadastro de pessoas e empresas é apenas um diretório sem valores ou transferências.
    Central operacional: tarefas, checklist, notas, anexos privados, dashboard e exportação CSV.
    Sem cálculos, saldos, aprovação financeira, remessas, gateway ou liquidação.
servers:
  - url: /api/v1
tags:
  - name: Conectividade
  - name: Autenticação
  - name: Administração de usuários
  - name: Pessoas e empresas
  - name: Central operacional
  - name: Cenários de repasse
  - name: Modelos e lotes
  - name: Revisão documental
  - name: Pacotes documentais
paths:
  /health:
    get:
      summary: Verificar disponibilidade básica da API
      tags: [Conectividade]
      operationId: health
      responses:
        '200':
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          description: Serviço ativo (não representa verificação da integridade do MySQL)
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  service:
                    type: string
                    enum: [fluxo-repasse-api]
                  version:
                    type: string
                    enum: [v1]
  /ready:
    get:
      summary: Verificar prontidão do serviço e estrutura mínima MySQL
      description: |
        Diferentemente de /health, verifica conexão com o banco e presença das
        tabelas necessárias à autenticação, usuários, papéis e auditoria.
        A resposta nunca divulga credenciais, host, SQL ou nomes de tabelas.
      tags: [Conectividade]
      operationId: readiness
      responses:
        '200':
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          description: Dependências essenciais disponíveis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: Banco ou estrutura mínima indisponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '429':
          description: Excesso de consultas de disponibilidade
  /auth/login:
    post:
      summary: Autenticar com e-mail e senha
      tags: [Autenticação]
      operationId: login
      description: Sem cadastro público. Sujeito a limite de tentativas por e-mail e IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: JWT de acesso. Nunca persista em localStorage.
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Limite de tentativas excedido
  /auth/me:
    get:
      summary: Consultar perfil autenticado
      tags: [Autenticação]
      operationId: me
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Dados básicos do usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/access:
    get:
      tags: [Autenticação]
      operationId: accessDiagnostic
      summary: Diagnosticar permissões e módulos liberados ao usuário autenticado
      description: |
        Retorna apenas as capacidades da própria conta e os módulos realmente
        implementados. Nenhuma permissão é concedida por esta consulta.
        Membros do papel platform_admin podem identificar permissões técnicas
        não sincronizadas; o reparo exige a CLI administrativa com confirmação.
        Mudanças no papel revogam JWTs antigos via auth_version.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Diagnóstico de acessos da própria sessão
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AccessDiagnostic' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      summary: Renovar JWT ainda válido
      tags: [Autenticação]
      operationId: refresh
      description: Revoga o token anterior, exige JWT válido; não funciona após expiração.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Novo token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/password:
    post:
      summary: Alterar a própria senha
      description: |
        Confere senha atual, valida a senha nova e incrementa auth_version.
        Todos os JWTs anteriores são invalidados, incluindo os de outros dispositivos.
        Após sucesso é obrigatório autenticar novamente.
      tags: [Autenticação]
      operationId: changePassword
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Senha alterada, todas as sessões anteriores invalidadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Limite de tentativas excedido
  /auth/logout:
    post:
      summary: Revogar JWT e encerrar sessão
      tags: [Autenticação]
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Sessão encerrada no servidor
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    example: Sessão encerrada.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /parties:
    get:
      tags: [Pessoas e empresas]
      summary: Listar cadastros protegidos por parties.manage
      operationId: listParties
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: query, name: search, schema: { type: string, maxLength: 100 } }
        - { in: query, name: type, schema: { type: string, enum: [all, person, company] } }
        - { in: query, name: status, schema: { type: string, enum: [all, active, inactive] } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Página de cadastros, sem cache e sem dados bancários }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Pessoas e empresas]
      summary: Criar cadastro de pessoa ou empresa
      operationId: createParty
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreParty' }
      responses:
        '201': { description: Cadastro criado com evento de auditoria }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /parties/{party}:
    parameters:
      - { in: path, name: party, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [Pessoas e empresas]
      summary: Consultar cadastro
      operationId: showParty
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Cadastro privado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Cadastro não encontrado }
    patch:
      tags: [Pessoas e empresas]
      summary: Editar dados de identificação e contato
      operationId: updateParty
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateParty' }
      responses:
        '200': { description: Cadastro atualizado e indicador changed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /parties/{party}/status:
    patch:
      tags: [Pessoas e empresas]
      summary: Ativar ou desativar cadastro sem excluir dados
      operationId: changePartyStatus
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: path, name: party, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_active]
              properties:
                is_active: { type: boolean }
      responses:
        '200': { description: Status alterado, evento preservado }
        '403': { $ref: '#/components/responses/Forbidden' }
  /parties/{party}/events:
    get:
      tags: [Pessoas e empresas]
      summary: Histórico paginado de alterações do cadastro
      operationId: listPartyEvents
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: path, name: party, required: true, schema: { type: integer, minimum: 1 } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Histórico mínimo, com tipo do evento e ID do operador }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/users:
    get:
      tags: [Administração de usuários]
      summary: Listar usuários com filtros e paginação (requer users.manage)
      operationId: listAdminUsers
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          schema: { type: string, maxLength: 100 }
        - name: status
          in: query
          schema: { type: string, enum: [all, active, inactive] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Página de usuários sem credenciais ou claims JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersPage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Administração de usuários]
      summary: Criar usuário sem qualquer papel ou permissão
      operationId: createAdminUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreUser' }
      responses:
        '201':
          description: Usuário criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Limite de gravações excedido }
  /admin/users/{user}:
    patch:
      tags: [Administração de usuários]
      summary: Atualizar nome e e-mail, sem alteração de papéis
      description: Alteração de e-mail revoga todos os JWTs anteriores da conta.
      operationId: updateAdminUser
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUser' }
      responses:
        '200':
          description: Usuário atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Usuário não encontrado }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/users/{user}/events:
    get:
      tags: [Administração de usuários]
      summary: Consultar eventos de segurança de uma conta
      operationId: listUserSecurityEvents
      description: |
        Requer users.manage. Retorna apenas id, tipo, operador e data.
        Não inclui hash de IP, payload de login, senha ou JWT.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - name: type
          in: query
          schema:
            type: string
            enum: [login_succeeded, token_refreshed, logout, password_changed, account_created, account_updated, account_email_changed, account_activated, account_deactivated, platform_admin_granted, platform_admin_revoked]
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000 }
      responses:
        '200':
          description: Histórico paginado limitado à conta informada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserAuditPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Conta não encontrada }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Limite de consultas excedido }
  /admin/users/{user}/status:
    patch:
      tags: [Administração de usuários]
      summary: Ativar ou desativar usuário comum, invalidando seus JWTs
      description: A API não permite desativar a própria conta nem contas administradoras por HTTP.
      operationId: setAdminUserStatus
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_active]
              properties:
                is_active: { type: boolean }
      responses:
        '200':
          description: Estado atualizado ou já coincidente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/UserResponse'
                  - type: object
                    properties:
                      changed: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Usuário não encontrado }
        '422': { $ref: '#/components/responses/ValidationError' }
  /operations/vehicles:
    get:
      operationId: operationsVehiclePortfolio
      summary: Carteira 360 de veículos, indicadores de atenção e custos gerenciais
      tags: [Central operacional]
      description: |
        Apenas cases.manage, JWT atual e sessão válida. A tabela principal
        é paginada e filtrada; summary contém contagens da frota inteira
        autorizada, não da página atual. Contagens de tarefas, checklist,
        anexos e valores são pré-agregadas por veículo, sem multiplicação
        por joins. Custos são gerenciais e não geram pagamento ou liquidação.
        Veículos arquivados podem ser consultados, mas não são selecionados
        pelos filtros de pendência.
      security:
        - BearerAuth: []
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 100 }, description: 'Busca em título, placa, chassi, marca, modelo, vendedor e origem' }
        - { name: status, in: query, schema: { type: string, enum: [all, draft, archived], default: all } }
        - { name: attention, in: query, schema: { type: string, enum: [all, overdue, open_tasks, missing_documents, incomplete_profile, planned_expenses], default: all } }
        - { name: sort, in: query, schema: { type: string, enum: [updated, oldest, purchase_desc, overdue], default: updated } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200':
          description: Carteira paginada, resumo global e instante de consulta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehiclePortfolioResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /repasse-cases/{case}/finance/summary:
    get:
      tags: [Financeiro 360 do veículo]
      operationId: vehicleFinanceSummary
      summary: Resumo gerencial do veículo
      description: |
        Requer bearer JWT vigente, session.current e cases.manage. Operações
        de escrita exigem veículo ativo. O módulo registra valores gerenciais,
        sem executar pagamento, cobrança, transferência ou liquidação.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: case, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Resposta autenticada sem efeito bancário
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Veículo, lançamento ou comprovante não localizado }
        '409': { description: Comprovante inválido ou integridade divergente }
        '422': { $ref: '#/components/responses/ValidationError' }
  /repasse-cases/{case}/finance/categories:
    get:
      tags: [Financeiro 360 do veículo]
      operationId: vehicleFinanceCategories
      summary: Listar categorias globais (single-org)
      description: |
        Requer bearer JWT vigente, session.current e cases.manage. Operações
        de escrita exigem veículo ativo. O módulo registra valores gerenciais,
        sem executar pagamento, cobrança, transferência ou liquidação.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: case, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: kind, in: query, schema: { type: string, enum: [all, expense, income] } }
        - { name: include_inactive, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Resposta autenticada sem efeito bancário
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Veículo, lançamento ou comprovante não localizado }
        '409': { description: Comprovante inválido ou integridade divergente }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Financeiro 360 do veículo]
      operationId: vehicleFinanceCategoryCreate
      summary: Criar categoria de despesa ou receita
      description: |
        Requer bearer JWT vigente, session.current e cases.manage. Operações
        de escrita exigem veículo ativo. O módulo registra valores gerenciais,
        sem executar pagamento, cobrança, transferência ou liquidação.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: case, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleFinanceCategoryInput' }
      responses:
        '201':
          description: Resposta autenticada sem efeito bancário
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Veículo, lançamento ou comprovante não localizado }
        '409': { description: Comprovante inválido ou integridade divergente }
        '422': { $ref: '#/components/responses/ValidationError' }
  /repasse-cases/{case}/finance/categories/{category}:
    patch:
      tags: [Financeiro 360 do veículo]
      operationId: vehicleFinanceCategoryUpdate
      summary: Renomear ou ativar/desativar categoria
      description: |
        Requer bearer JWT vigente, session.current e cases.manage. Operações
        de escrita exigem veículo ativo. O módulo registra valores gerenciais,
        sem executar pagamento, cobrança, transferência ou liquidação.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: case, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: category, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleFinanceCategoryUpdate' }
      responses:
        '200':
          description: Resposta autenticada sem efeito bancário
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Veículo, lançamento ou comprovante não localizado }
        '409': { description: Comprovante inválido ou integridade divergente }
        '422': { $ref: '#/components/responses/ValidationError' }
  /repasse-cases/{case}/finance/entries:
    get:
      tags: [Financeiro 360 do veículo]
      operationId: vehicleFinanceEntries
      summary: Filtrar e paginar lançamentos gerenciais
      description: |
        Requer bearer JWT vigente, session.current e cases.manage. Operações
        de escrita exigem veículo ativo. O módulo registra valores gerenciais,
        sem executar pagamento, cobrança, transferência ou liquidação.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: case, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: kind, in: query, schema: { type: string, enum: [all, expense, income] } }
        - { name: status, in: query, schema: { type: string, enum: [all, planned, realized] } }
        - { name: category_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: include_voided, in: query, schema: { type: boolean } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Resposta autenticada sem efeito bancário
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Veículo, lançamento ou comprovante não localizado }
        '409': { description: Comprovante inválido ou integridade divergente }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Financeiro 360 do veículo]
      operationId: vehicleFinanceEntryCreate
      summary: Criar lançamento com categoria livre ou cadastrada
      description: |
        Requer bearer JWT vigente, session.current e cases.manage. Operações
        de escrita exigem veículo ativo. O módulo registra valores gerenciais,
        sem executar pagamento, cobrança, transferência ou liquidação.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: case, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleFinanceEntryInput' }
      responses:
        '201':
          description: Resposta autenticada sem efeito bancário
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
