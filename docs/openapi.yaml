openapi: 3.0.3
info:
  title: Fluxo Repasse API
  version: 0.8.0
  description: |
    Contratos da fundação de identidade e conectividade.
    Inclui controle de ciclo de vida de conta, rotação global de sessões e auditoria de identidade.
    Respostas v1 aplicam Cache-Control no-store/private, Pragma no-cache, nosniff,
    Referrer-Policy no-referrer, X-Frame-Options DENY e CSP restritiva.
    Toda resposta da API expõe X-Request-ID gerado pelo servidor, para correlação de erros sem dados privados.
    Não há endpoints financeiros neste estágio.
servers:
  - url: /api/v1
tags:
  - name: Conectividade
  - name: Autenticação
  - name: Administração de usuários
paths:
  /health:
    get:
      summary: Verificar disponibilidade básica da API
      tags: [Conectividade]
      operationId: health
      responses:
        '200':
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          description: Serviço ativo (não representa verificação da integridade do MySQL)
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  service:
                    type: string
                    enum: [fluxo-repasse-api]
                  version:
                    type: string
                    enum: [v1]
  /ready:
    get:
      summary: Verificar prontidão do serviço e estrutura mínima MySQL
      description: |
        Diferentemente de /health, verifica conexão com o banco e presença das
        tabelas necessárias à autenticação, usuários, papéis e auditoria.
        A resposta nunca divulga credenciais, host, SQL ou nomes de tabelas.
      tags: [Conectividade]
      operationId: readiness
      responses:
        '200':
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          description: Dependências essenciais disponíveis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: Banco ou estrutura mínima indisponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '429':
          description: Excesso de consultas de disponibilidade
  /auth/login:
    post:
      summary: Autenticar com e-mail e senha
      tags: [Autenticação]
      operationId: login
      description: Sem cadastro público. Sujeito a limite de tentativas por e-mail e IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: JWT de acesso. Nunca persista em localStorage.
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Limite de tentativas excedido
  /auth/me:
    get:
      summary: Consultar perfil autenticado
      tags: [Autenticação]
      operationId: me
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Dados básicos do usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      summary: Renovar JWT ainda válido
      tags: [Autenticação]
      operationId: refresh
      description: Revoga o token anterior, exige JWT válido; não funciona após expiração.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Novo token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/password:
    post:
      summary: Alterar a própria senha
      description: |
        Confere senha atual, valida a senha nova e incrementa auth_version.
        Todos os JWTs anteriores são invalidados, incluindo os de outros dispositivos.
        Após sucesso é obrigatório autenticar novamente.
      tags: [Autenticação]
      operationId: changePassword
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Senha alterada, todas as sessões anteriores invalidadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Limite de tentativas excedido
  /auth/logout:
    post:
      summary: Revogar JWT e encerrar sessão
      tags: [Autenticação]
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Sessão encerrada no servidor
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    example: Sessão encerrada.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/users:
    get:
      tags: [Administração de usuários]
      summary: Listar usuários com filtros e paginação (requer users.manage)
      operationId: listAdminUsers
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          schema: { type: string, maxLength: 100 }
        - name: status
          in: query
          schema: { type: string, enum: [all, active, inactive] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Página de usuários sem credenciais ou claims JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersPage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Administração de usuários]
      summary: Criar usuário sem qualquer papel ou permissão
      operationId: createAdminUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreUser' }
      responses:
        '201':
          description: Usuário criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Limite de gravações excedido }
  /admin/users/{user}:
    patch:
      tags: [Administração de usuários]
      summary: Atualizar nome e e-mail, sem alteração de papéis
      description: Alteração de e-mail revoga todos os JWTs anteriores da conta.
      operationId: updateAdminUser
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUser' }
      responses:
        '200':
          description: Usuário atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Usuário não encontrado }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/users/{user}/events:
    get:
      tags: [Administração de usuários]
      summary: Consultar eventos de segurança de uma conta
      operationId: listUserSecurityEvents
      description: |
        Requer users.manage. Retorna apenas id, tipo, operador e data.
        Não inclui hash de IP, payload de login, senha ou JWT.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - name: type
          in: query
          schema:
            type: string
            enum: [login_succeeded, token_refreshed, logout, password_changed, account_created, account_updated, account_email_changed, account_activated, account_deactivated, platform_admin_granted, platform_admin_revoked]
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000 }
      responses:
        '200':
          description: Histórico paginado limitado à conta informada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserAuditPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Conta não encontrada }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Limite de consultas excedido }
  /admin/users/{user}/status:
    patch:
      tags: [Administração de usuários]
      summary: Ativar ou desativar usuário comum, invalidando seus JWTs
      description: A API não permite desativar a própria conta nem contas administradoras por HTTP.
      operationId: setAdminUserStatus
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_active]
              properties:
                is_active: { type: boolean }
      responses:
        '200':
          description: Estado atualizado ou já coincidente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/UserResponse'
                  - type: object
                    properties:
                      changed: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Usuário não encontrado }
        '422': { $ref: '#/components/responses/ValidationError' }
components:
  headers:
    RequestId:
      description: UUID gerado pelo servidor a cada requisição. Não aceita valor fornecido pelo cliente.
      schema: { type: string, format: uuid }
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserId:
      name: user
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  schemas:
    Readiness:
      type: object
      required: [status, service, version]
      properties:
        status:
          type: string
          enum: [ready, unavailable]
        service:
          type: string
          enum: [fluxo-repasse-api]
        version:
          type: string
          enum: [v1]
    UserAuditEvent:
      type: object
      required: [id, event_type, actor_user_id, created_at]
      properties:
        id: { type: integer }
        event_type: { type: string }
        actor_user_id: { type: integer, nullable: true }
        created_at:
          type: string
          description: Timestamp registrado pelo banco da API.
    UserAuditPage:
      type: object
      required: [user_id, events]
      properties:
        user_id: { type: integer }
        events:
          type: object
          required: [data, current_page, last_page, total]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/UserAuditEvent' }
            current_page: { type: integer }
            last_page: { type: integer }
            total: { type: integer }
    UserRecord:
      type: object
      required: [id, name, email, is_active, created_at]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
    UserResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/UserRecord' }
    UsersPage:
      type: object
      required: [current_page, data, last_page, per_page, total]
      properties:
        current_page: { type: integer }
        data:
          type: array
          items: { $ref: '#/components/schemas/UserRecord' }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
    StoreUser:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name: { type: string, minLength: 2, maxLength: 255 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 12 }
        password_confirmation: { type: string, format: password, minLength: 12 }
    UpdateUser:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 255 }
        email: { type: string, format: email, maxLength: 254 }
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password, new_password_confirmation]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 12
          description: Requer maiúscula, minúscula, número e símbolo.
        new_password_confirmation:
          type: string
          format: password
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
    Token:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: Token privado, de curta duração.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Tempo de validade em segundos.
          example: 900
    ProfileResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, name, email]
          properties:
            id:
              type: integer
            name:
              type: string
            email:
              type: string
              format: email
            permissions:
              type: array
              items: { type: string }
    Error:
      type: object
      properties:
        message:
          type: string
  responses:
    Forbidden:
      description: Permissão técnica users.manage ausente
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Credenciais inválidas, sessão ausente ou token recusado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Campos inválidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
