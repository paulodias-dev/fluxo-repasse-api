# Não usar em produção. Sem portas MySQL publicadas e sem volumes destruídos automaticamente.
name: fluxo-repasse-qa
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${QA_DB_NAME:-repasse_qa}
      MYSQL_USER: ${QA_DB_USER:-repasse_qa}
      MYSQL_PASSWORD: ${QA_DB_PASSWORD:?Defina QA_DB_PASSWORD no ambiente}
      MYSQL_ROOT_PASSWORD: ${QA_DB_ROOT_PASSWORD:?Defina QA_DB_ROOT_PASSWORD no ambiente}
    volumes:
      - mysql_qa:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 24

  api:
    build:
      context: .
      dockerfile: qa/Dockerfile.api
    working_dir: /workspace/api
    volumes:
      - .:/workspace/api
    environment:
      APP_NAME: Fluxo Repasse QA
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: ${QA_APP_KEY:?Defina QA_APP_KEY no ambiente}
      JWT_SECRET: ${QA_JWT_SECRET:?Defina QA_JWT_SECRET no ambiente}
      JWT_BLACKLIST_ENABLED: "true"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      DB_CONNECTION: mysql
      DB_URL: ""
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${QA_DB_NAME:-repasse_qa}
      DB_USERNAME: ${QA_DB_USER:-repasse_qa}
      DB_PASSWORD: ${QA_DB_PASSWORD:?Defina QA_DB_PASSWORD no ambiente}
    ports:
      - "127.0.0.1:${QA_API_PORT:-18080}:8000"
    depends_on:
      mysql:
        condition: service_healthy
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]

  app:
    image: node:22-bookworm
    working_dir: /workspace/app
    volumes:
      - ${QA_APP_PATH:?Defina QA_APP_PATH para o clone APP}:/workspace/app
    environment:
      QA_API_BASE_URL: http://api:8000
      QA_USER_EMAIL: ${QA_USER_EMAIL:-}
      QA_USER_PASSWORD: ${QA_USER_PASSWORD:-}
      QA_REQUIRE_AUTH: ${QA_REQUIRE_AUTH:-0}
      QA_REQUIRE_ADMIN: ${QA_REQUIRE_ADMIN:-0}
      QA_BASIC_USER_EMAIL: ${QA_BASIC_USER_EMAIL:-}
      QA_BASIC_USER_PASSWORD: ${QA_BASIC_USER_PASSWORD:-}
    depends_on:
      api:
        condition: service_started
    command: ["node", "--version"]

volumes:
  mysql_qa:
